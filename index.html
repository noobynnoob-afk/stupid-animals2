<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>STUPID ANIMALS</title><style>
*{box-sizing:border-box}body{margin:0;background:#91cfff;font-family:system-ui,sans-serif;overflow:hidden;color:#222}canvas{display:block}#overlay{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#7fc6f9,#b9eb91);z-index:5}#panel{background:#fffdf2;border:4px solid #222;border-radius:18px;box-shadow:9px 9px #222;padding:20px;width:min(680px,94vw);text-align:center}h1{margin:0 0 12px;font-size:clamp(25px,5vw,44px)}button,input{font:inherit}button{border:3px solid #222;border-radius:10px;background:#ffd557;padding:9px 14px;cursor:pointer;font-weight:800}button:active{transform:translateY(2px)}input{border:3px solid #222;border-radius:8px;padding:10px;width:min(320px,95%)}.choices{display:flex;gap:15px;justify-content:space-around;margin:15px 0}.pick{flex:1;min-width:0;background:#d7f1fc;border:3px solid #222;border-radius:10px;padding:10px}.pick b{display:block;margin-bottom:8px}.pick>div{display:flex;align-items:center;justify-content:space-around;gap:5px}.pick span{font-weight:900;font-size:clamp(14px,3vw,23px)}#hud{display:none;position:fixed;inset:0;pointer-events:none}#top{position:absolute;top:10px;left:10px;background:#ffffffd9;padding:8px 12px;border:2px solid #222;border-radius:8px;font-weight:800}#exit{position:absolute;top:10px;right:10px;pointer-events:auto}#chat{position:absolute;bottom:12px;left:12px;width:min(340px,55vw);pointer-events:auto}#log{height:140px;overflow-y:auto;background:#ffffffa8;border:2px solid #222;border-radius:8px;padding:6px;font-size:12px;word-break:break-word}#chatline{display:flex;gap:4px;margin-top:5px}#chatinput{min-width:0;width:100%;font-size:13px;padding:6px}#send{padding:5px 8px}#crosshair{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:30px;text-shadow:0 0 3px white}#shoot{position:absolute;right:24px;bottom:35px;width:82px;height:82px;border-radius:50%;background:#ff6868;pointer-events:auto}#joystick{display:none;position:absolute;bottom:30px;left:20px;width:112px;height:112px;border:3px solid #333;border-radius:50%;background:#ffffff66;pointer-events:auto;touch-action:none}#knob{position:absolute;width:44px;height:44px;border-radius:50%;background:#4449;left:31px;top:31px}#tip{position:absolute;top:48px;left:10px;background:#ffffff9c;padding:4px;font-size:11px}@media(pointer:coarse){#joystick{display:block}#chat{bottom:155px}#log{height:72px}#tip{display:none}}@media(max-height:430px){#panel{padding:9px}.choices{margin:5px 0}#log{height:55px}#chat{bottom:6px}}
.preview{display:block;width:100%;height:clamp(95px,23vh,210px);background:#ccebf3;border:2px solid #222;border-radius:10px;margin:7px auto;touch-action:none}#selectStep .choices{align-items:stretch}#selectStep .pick{max-width:48%}@media(max-height:430px){.preview{height:90px}}#gamecanvas{touch-action:none}</style></head><body><div id="overlay"><div id="panel"><h1>🐈 STUPID ANIMALS 🦎</h1><div id="nameStep"><p>닉네임을 입력해!</p><input id="nickname" maxlength="18" placeholder="닉네임"/><p><button id="next">다음 →</button></p></div><div id="selectStep" hidden><div class="choices"><section class="pick"><b>캐릭터</b><canvas id="animalPreview" class="preview"></canvas><div><button id="prevAnimal">◀</button><span id="animalLabel"></span><button id="nextAnimal">▶</button></div></section><section class="pick"><b>총</b><canvas id="gunPreview" class="preview"></canvas><div><button id="prevGun">◀</button><span id="gunLabel"></span><button id="nextGun">▶</button></div></section></div><button id="play">게임 입장!</button></div></div></div><div id="hud"><div id="top"></div><button id="exit">나가기</button><div id="tip">WASD 이동 · 마우스 드래그로 시점 회전 · 클릭 발사</div><div id="crosshair">+</div><div id="chat"><div id="log"></div><div id="chatline"><input id="chatinput" maxlength="100" placeholder="채팅 (Enter)"/><button id="send">전송</button></div></div><div id="joystick"><div id="knob"></div></div><button id="shoot">발사!</button></div><script src="/socket.io/socket.io.js"></script><script type="module" src="/game.js"></script></body></html>
